<html lang="es">
<head>
  <meta charset="UTF-8">

  <style>
    body {

    .boton-borrar {

  <script>
    /* ---------- Conexión con Supabase ---------- */
    // Estas dos líneas conectan la app con tu base de datos en la nube.
    // La URL y la clave son PÚBLICAS: pueden verse desde el navegador,
    // por eso Supabase tiene las políticas RLS que ya configuramos —
    // ellas son las que controlan qué se puede leer y escribir.
    var SUPABASE_URL = "https://yvotjekqbddmtfdhfshp.supabase.co";
    var SUPABASE_KEY = "sb_publishable_VwVJLOyUCWYt1LLxWNy6Wg_3Xcwi5KY";

    // Protección: si la librería no cargó (bloqueos, sin internet, etc.),
    // la app sigue funcionando con localStorage y NO queda en blanco.
    var supabaseClient = null;
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      console.log("Conexión con Supabase lista.");
    } else {
      console.log("Aviso: la librería de Supabase no cargó. La app funciona en modo local.");
    }

    // ETAPA 1: Envía un reporte a Supabase (además de guardarlo en localStorage).
    // Es una función auxiliar - no rompe nada si Supabase falla, solo lo avisa.
    async function enviarASupabase(reporte) {
      if (!supabaseClient) {
        console.log("Supabase no disponible: el reporte quedó guardado solo en este dispositivo.");
        return null;
      }
      try {
        // ETAPA 3: primero subimos las fotos al Storage y obtenemos sus URLs
        var urlsFotos = await subirFotosAStorage(reporte.fotos || []);

        // .select() al final hace que Supabase nos devuelva la fila creada,
        // con el id real asignado, para poder marcarlo como votado.
        var { data, error } = await supabaseClient
          .from("reportes")
          .insert([{
            categoria: reporte.categoria,
            departamento: reporte.departamento,
            ubicacion: reporte.ubicacion,
            descripcion: reporte.descripcion,
            contador: reporte.contador || 1,
            autor: reporte.autor,
            gps: reporte.gps,
            oculto: false,
            fotos: urlsFotos
          }])
          .select();
        if (error) {
          console.log("Supabase INSERT error:", error);
          return null;
        }
        console.log("Reporte enviado a Supabase con", urlsFotos.length, "foto(s):", data);
        if (data && data.length > 0) {
          return "sb-" + data[0].id;
        }
        return null;
      } catch (e) {
        console.log("Error de conexión con Supabase:", e);
        return null;
      }
    }

    // ETAPA 3: Sube cada foto al Storage y devuelve la lista de URLs.
    // Las fotos vienen como texto base64 (así las tenemos en fotosActuales).
    // Las convertimos a archivo real y las subimos al bucket "fotos-reportes".
    async function subirFotosAStorage(fotosBase64) {
      var urls = [];
      if (!supabaseClient || !fotosBase64 || fotosBase64.length === 0) {
        return urls;
      }
      for (var i = 0; i < fotosBase64.length; i++) {
        var base64 = fotosBase64[i];
        try {
          // Convertimos el texto base64 a un archivo Blob (formato de archivo real)
          var respuesta = await fetch(base64);
          var blob = await respuesta.blob();

          // Nombre único para cada foto (fecha + número random)
          var nombre = "foto-" + Date.now() + "-" + Math.floor(Math.random() * 10000) + ".jpg";

          // Subimos al bucket "fotos-reportes"
          var { data: subida, error: errorSubida } = await supabaseClient
            .storage
            .from("fotos-reportes")
            .upload(nombre, blob, { contentType: "image/jpeg" });

          if (errorSubida) {
            console.log("Storage upload error:", errorSubida);
            continue;
          }

          // Pedimos la URL pública de la foto que subimos
          var { data: urlData } = supabaseClient
            .storage
            .from("fotos-reportes")
            .getPublicUrl(nombre);

          if (urlData && urlData.publicUrl) {
            urls.push(urlData.publicUrl);
            console.log("Foto subida:", urlData.publicUrl);
          }
        } catch (e) {
          console.log("Error subiendo foto:", e);
        }
      }
      return urls;
    }

    // ETAPA 2: Trae todos los reportes desde Supabase.
    // Devuelve la lista con el formato que usa mostrarHistorial.
    // Si Supabase falla, devuelve los reportes locales como respaldo.
    async function traerReportesDeSupabase() {
      if (!supabaseClient) {
        console.log("Supabase no disponible: mostrando reportes locales.");
        return JSON.parse(localStorage.getItem("reportes") || "[]");
      }
      try {
        var { data, error } = await supabaseClient
          .from("reportes")
          .select("*")
          .order("created_at", { ascending: true });
        if (error) {
          console.log("Supabase SELECT error:", error);
          return JSON.parse(localStorage.getItem("reportes") || "[]");
        }
        console.log("Reportes traídos de Supabase:", data.length);
        // Adaptamos el formato de Supabase al que usa la app
        var lista = [];
        for (var i = 0; i < data.length; i++) {
          var d = data[i];
          lista.push({
            id: "sb-" + d.id,
            categoria: d.categoria,
            departamento: d.departamento,
            ubicacion: d.ubicacion,
            descripcion: d.descripcion,
            contador: d.contador || 1,
            autor: d.autor,
            gps: d.gps,
            fecha: new Date(d.created_at).toLocaleString("es-AR"),
            aportes: d.aportes || [],
            fotos: d.fotos || [],
            denuncias: d.denuncias || 0,
            motivosDenuncia: d.motivos_denuncia || [],
            ocultoPorDenuncias: d.oculto || false
          });
        }
        return lista;
      } catch (e) {
        console.log("Error de conexión con Supabase:", e);
        return JSON.parse(localStorage.getItem("reportes") || "[]");
      }
    }

    // Caché de reportes que trajimos de Supabase la última vez.
    // Se actualiza cada vez que llamamos a mostrarHistorial.
    var reportesEnMemoria = [];

    var fotosActuales = [];
    var MAX_FOTOS = 4;
    var UMBRAL_AMARILLO = 10;
    var UMBRAL_ROJO = 20;
    var DENUNCIAS_PARA_OCULTAR = 3;
    var duplicadoActual = -1;
    var esAdmin = false;
    var gpsActual = null;

    var CLAVE_ADMIN = "mendoza2026";

    /*
      Rectángulos aproximados con márgenes generosos para cada departamento
      de Mendoza. Se usan para verificar si el GPS del vecino coincide con
      el departamento que eligió.

      Formato: [lat_sur, lat_norte, lng_oeste, lng_este]

      Los márgenes son generosos a propósito: preferimos aceptar un reporte
      dudoso a rechazar uno legítimo. Si un vecino queda bloqueado
      injustamente, avisa y ajustamos.
    */
    var LIMITES_DEPARTAMENTOS = {
      "Capital":         [-32.94, -32.85, -68.87, -68.79],
      "Godoy Cruz":      [-32.97, -32.88, -68.87, -68.79],
      "Guaymallén":      [-32.96, -32.83, -68.85, -68.68],
      "Las Heras":       [-33.00, -32.30, -69.60, -68.70],
      "Luján de Cuyo":   [-33.30, -32.90, -69.40, -68.70],
      "Maipú":           [-33.15, -32.90, -68.85, -68.55],
      "Junín":           [-33.30, -33.05, -68.55, -68.30],
      "Rivadavia":       [-33.35, -33.05, -68.60, -68.20],
      "San Martín":      [-33.20, -32.90, -68.65, -68.25],
      "Santa Rosa":      [-33.50, -32.90, -68.35, -67.60],
      "La Paz":          [-33.75, -32.90, -68.00, -67.10],
      "Lavalle":         [-32.80, -31.85, -68.90, -67.30],
      "Tunuyán":         [-33.85, -33.30, -69.55, -68.75],
      "Tupungato":       [-33.60, -33.10, -69.75, -68.80],
      "San Carlos":      [-34.20, -33.55, -69.65, -68.55],
      "General Alvear":  [-35.35, -34.30, -68.55, -66.85],
      "San Rafael":      [-35.30, -33.90, -70.10, -67.30],
      "Malargüe":        [-37.60, -34.70, -71.00, -68.20]
    };

    /*
      Verifica si un punto GPS está dentro del rectángulo del departamento.
      Devuelve true si coincide, false si NO coincide.
    */
    function gpsCoincideConDepartamento(lat, lng, departamento) {
      var limites = LIMITES_DEPARTAMENTOS[departamento];
      if (!limites) {
        // Si no tenemos los límites, mejor no bloquear
        return true;
      }
      var latSur = limites[0];
      var latNorte = limites[1];
      var lngOeste = limites[2];
      var lngEste = limites[3];
      return (lat >= latSur && lat <= latNorte &&
              lng >= lngOeste && lng <= lngEste);
    }

    /*
      Canales oficiales de reclamo por municipio.
      Los datos con fuente oficial verificada están completos.
      Los marcados "por completar" son municipios donde solo se encontró
      la web oficial y hay que ir en persona/llamar para conseguir teléfono
      específico de reclamos - completar cuando se pueda.
    */

    /* ---------- Estadísticas ---------- */
    function contarPor(reportes, campo) {
      var conteo = {};
      for (var i = 0; i < reportes.length; i++) {
        var clave = reportes[i][campo];
        if (!conteo[clave]) {
          conteo[clave] = 0;
        }
        conteo[clave] = conteo[clave] + 1;
      }
      return conteo;
    }

    function ordenarConteo(conteo) {
      var filas = [];
      for (var clave in conteo) {
        filas.push({ nombre: clave, cantidad: conteo[clave] });
      }
      filas.sort(function(a, b) {
        return b.cantidad - a.cantidad;
      });
      return filas;
    }

    function htmlBarras(filas) {
      var maximo = 1;
      for (var i = 0; i < filas.length; i++) {
        if (filas[i].cantidad > maximo) {
          maximo = filas[i].cantidad;
        }
      }
      var html = "";
      for (var i = 0; i < filas.length; i++) {
        var f = filas[i];
        var porcentaje = Math.round(f.cantidad * 100 / maximo);
        html = html + "<div class='stat-fila'>" +
          "<span class='stat-nombre'>" + f.nombre + "</span>" +
          "<div class='stat-pista'><div class='stat-relleno' style='width: " + porcentaje + "%;'></div></div>" +
          "<span class='stat-numero'>" + f.cantidad + "</span>" +
          "</div>";
      }
      return html;
    }

    function mostrarEstadisticas() {
      // Usamos los reportes ya cargados en memoria (traídos de Supabase)
      var reportes = reportesEnMemoria || [];
      var filtro = document.getElementById("filtroResumen").value;
      var caja = document.getElementById("estadisticas");

      if (filtro !== "__todos__") {
        var filtrados = [];
        for (var i = 0; i < reportes.length; i++) {
          if (reportes[i].departamento === filtro) {
            filtrados.push(reportes[i]);
          }
        }
        reportes = filtrados;
      }

      if (reportes.length === 0) {
        caja.innerHTML = "<p>Todavía no hay datos para esta selección.</p>";
        return;
      }

      var totalVecinos = 0;
      for (var i = 0; i < reportes.length; i++) {
        totalVecinos = totalVecinos + (reportes[i].contador || 1);
      }

      var html = "<p class='stat-total'><strong>" + reportes.length + "</strong> reporte" +
        (reportes.length === 1 ? "" : "s") + " · <strong>" + totalVecinos + "</strong> vecino" +
        (totalVecinos === 1 ? "" : "s") + " participando</p>";

      html = html + "<p class='stat-titulo'>Por categoría</p>";
      html = html + htmlBarras(ordenarConteo(contarPor(reportes, "categoria")));

      if (filtro === "__todos__") {
        html = html + "<p class='stat-titulo'>Por departamento</p>";
        html = html + htmlBarras(ordenarConteo(contarPor(reportes, "departamento")));
      }

      caja.innerHTML = html;
    }

        function(posicion) {
          gpsActual = {
            lat: posicion.coords.latitude,

          };
          var campo = document.getElementById("ubicacion");
          if (campo.value === "") {
            campo.value = "Ubicación GPS: " + gpsActual.lat.toFixed(5) + ", " + gpsActual.lng.toFixed(5);
          }
          mostrarMapa(gpsActual.lat + "," + gpsActual.lng);

        },
        function(error) {

        }

    /* ---------- Fotos ---------- */
    function prepararFoto(idCampo) {
      var campo = document.getElementById(idCampo);
      var archivos = campo.files;
      if (!archivos || archivos.length === 0) {
        return;
      }
      for (var i = 0; i < archivos.length; i++) {

          alert("Máximo " + MAX_FOTOS + " fotos por reporte.");
          break;
        }
        agregarFoto(archivos[i]);
      }
      campo.value = "";
    }

    function agregarFoto(archivo) {
      var lector = new FileReader();
      lector.onload = function(evento) {
        achicarImagen(evento.target.result, function(imagenChica) {
          if (fotosActuales.length >= MAX_FOTOS) {
            return;
          }
          fotosActuales.push(imagenChica);
          dibujarMiniaturas();
        });
      };
      lector.readAsDataURL(archivo);
    }

    function quitarFoto(posicion) {
      fotosActuales.splice(posicion, 1);
      dibujarMiniaturas();
    }

    function dibujarMiniaturas() {
      var caja = document.getElementById("miniaturas");
      var html = "";
      for (var i = 0; i < fotosActuales.length; i++) {
        html = html + "<div class='miniatura'>" +
          "<img src='" + fotosActuales[i] + "'>" +
          "<button type='button' onclick='quitarFoto(" + i + ")'>✕</button>" +
          "</div>";
      }
      caja.innerHTML = html;
    }

    function achicarImagen(imagenOriginal, cuandoTermine) {
      var img = new Image();
      img.onload = function() {
        var MAXIMO = 800;
        var ancho = img.width;
        var alto = img.height;
        if (ancho > MAXIMO || alto > MAXIMO) {
          if (ancho > alto) {
            alto = Math.round(alto * MAXIMO / ancho);
            ancho = MAXIMO;
          } else {
            ancho = Math.round(ancho * MAXIMO / alto);
            alto = MAXIMO;
          }
        }
        var canvas = document.createElement("canvas");
        canvas.width = ancho;
        canvas.height = alto;
        canvas.getContext("2d").drawImage(img, 0, 0, ancho, alto);
        cuandoTermine(canvas.toDataURL("image/jpeg", 0.7));
      };
      img.src = imagenOriginal;
    }

    function htmlFotos(objeto) {
      var lista = [];
      if (objeto.fotos && objeto.fotos.length > 0) {
        lista = objeto.fotos;
      } else if (objeto.foto) {
        lista = [objeto.foto];
      }
      var html = "";
      for (var i = 0; i < lista.length; i++) {
        html = html + "<img class='foto-reporte' src='" + lista[i] + "'>";
      }
      return html;
    }

    /* ---------- Duplicados ---------- */
    function normalizar(texto) {
      return texto
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function ubicacionesParecidas(a, b) {
      a = normalizar(a);
      b = normalizar(b);
      if (a === "" || b === "") {
        return false;
      }
      if (a === b) {
        return true;
      }
      if (a.length >= 5 && b.length >= 5) {
        if (a.indexOf(b) !== -1 || b.indexOf(a) !== -1) {
          return true;
        }
      }
      return false;
    }

    function buscarDuplicado(reportes, categoria, departamento, ubicacion) {
      for (var i = 0; i < reportes.length; i++) {
        var r = reportes[i];
        if (
          r.categoria === categoria &&
          r.departamento === departamento &&
          ubicacionesParecidas(r.ubicacion || "", ubicacion)
        ) {
          return i;
        }
      }
      return -1;
    }

    function verificarDuplicado() {
      var categoria = document.getElementById("categoria").value;
      var departamento = document.getElementById("departamento").value;
      var ubicacion = document.getElementById("ubicacion").value;
      var aviso = document.getElementById("avisoDuplicado");

      if (normalizar(ubicacion).length < 4) {
        aviso.style.display = "none";
        duplicadoActual = -1;
        return;
      }

      var reportes = JSON.parse(localStorage.getItem("reportes") || "[]");
      var posicion = buscarDuplicado(reportes, categoria, departamento, ubicacion);

      if (posicion === -1) {
        aviso.style.display = "none";
        duplicadoActual = -1;
        return;
      }

      duplicadoActual = posicion;
      var existente = reportes[posicion];
      aviso.innerHTML =
        "⚠️ <strong>Ya existe un reporte de \"" + existente.categoria +
        "\" en \"" + existente.ubicacion + "\"</strong>, con " + (existente.contador || 1) +
        " vecino(s). Podés sumar tus fotos y comentario a ese reporte en vez de crear uno nuevo." +
        "<button onclick='sumarmeAlExistente()'>Sumarme a ese reporte con mis fotos y comentario</button>";
      aviso.style.display = "block";
    }

    /* ---------- Guardado ---------- */
    function guardar(reportes) {
      try {
        localStorage.setItem("reportes", JSON.stringify(reportes));
        return true;
      } catch (e) {
        alert("El almacenamiento del navegador se llenó. Probá con menos fotos o borrá reportes viejos.");
        return false;
      }
    }

    /* ---------- Bloqueo de +1 por dispositivo ---------- */
    // Guardamos en localStorage la lista de IDs de reportes que este
    // dispositivo ya votó. Así, al recargar, sigue reconociéndolos.
    function reportesVotadosDelDispositivo() {
      return JSON.parse(localStorage.getItem("votados") || "[]");
    }

    function marcarComoVotado(id) {
      var votados = reportesVotadosDelDispositivo();
      votados.push(id);
      localStorage.setItem("votados", JSON.stringify(votados));
    }

    function yaVoto(id) {
      var votados = reportesVotadosDelDispositivo();
      return votados.indexOf(id) !== -1;
    }

    // Los reportes viejos no tenían ID único: si no lo tienen, se lo
    // asignamos al vuelo (una vez, y queda guardado)
    function asegurarId(reportes, posicion) {
      if (!reportes[posicion].id) {
        reportes[posicion].id = "r" + Date.now() + "-" + Math.floor(Math.random() * 10000);
      }
    }

    /* ---------- Envío y aportes ---------- */
    async function sumarmeAlExistente() {
      if (duplicadoActual === -1) {
        return;
      }

      if (!document.getElementById("conformidad").checked) {
        alert("Marcá la declaración de conformidad antes de enviar tu aporte.");
        return;
      }

      var descripcion = document.getElementById("descripcion").value;
      if (descripcion === "" && fotosActuales.length === 0) {
        alert("Escribí un comentario o subí al menos una foto para sumar al reporte.");
        return;
      }

      var autor = leerIdentidad();
      if (autor === "incompleto") {
        alert("Completá nombre, apellido y DNI, o elegí modo anónimo.");
        return;
      }

      var existente = reportesEnMemoria[duplicadoActual];
      if (!existente) {
        return;
      }

      var idSb = idNumericoSupabase(existente.id);
      if (!idSb || !supabaseClient) {
        alert("No se pudo conectar con la nube. Intentá de nuevo en un momento.");
        return;
      }

      // Subimos las fotos del aporte al Storage
      var urlsFotos = await subirFotosAStorage(fotosActuales);

      // Preparamos el nuevo aporte
      var aportesActuales = existente.aportes || [];
      aportesActuales.push({
        descripcion: descripcion,
        fotos: urlsFotos,
        autor: autor,
        fecha: new Date().toLocaleString("es-AR")
      });

      // Si es la primera vez que este dispositivo vota, sumamos al contador
      var yaVotoAntes = yaVoto(existente.id);
      var nuevoContador = yaVotoAntes ? existente.contador : (existente.contador || 1) + 1;

      var { error } = await supabaseClient
        .from("reportes")
        .update({
          aportes: aportesActuales,
          contador: nuevoContador
        })
        .eq("id", idSb);

      if (error) {
        console.log("Error al sumar aporte:", error);
        alert("No se pudo sumar tu aporte. Intentá de nuevo.");
        return;
      }

      if (!yaVotoAntes) {
        marcarComoVotado(existente.id);
      }

      console.log("Aporte sumado a Supabase.");
      mostrarHistorial();
      limpiarFormulario();
      alert("¡Listo! Tu aporte se sumó al reporte existente.");
    }

    async function enviarReporte() {
      var categoria = document.getElementById("categoria").value;
      var departamento = document.getElementById("departamento").value;
      var ubicacion = document.getElementById("ubicacion").value;
      var descripcion = document.getElementById("descripcion").value;

      if (ubicacion === "") {
        alert("Indicá la ubicación (calle, esquina o referencia).");
        return;
      }
      if (descripcion === "") {
        alert("Contanos qué pasa antes de enviar.");
        return;
      }

      // NUEVO: Verificación de GPS vs departamento
      if (gpsActual) {
        // Si el vecino sí capturó GPS, verificamos coincidencia con el departamento
        if (!gpsCoincideConDepartamento(gpsActual.lat, gpsActual.lng, departamento)) {
          alert(
            "❌ Tu ubicación GPS no coincide con el departamento seleccionado.\n\n" +
            "Estás en coordenadas:\n" +
            "Lat: " + gpsActual.lat.toFixed(4) + "\n" +
            "Lng: " + gpsActual.lng.toFixed(4) + "\n\n" +
            "Elegiste el departamento: " + departamento + "\n\n" +
            "Revisá si elegiste el departamento correcto, o volvé a capturar tu ubicación GPS.\n\n" +
            "Si estás seguro de que la validación falla injustamente, escribí a " +
            "contacto.fallasmendoza@gmail.com para que ajustemos los límites."
          );
          return;
        }
      } else {
        // Si el vecino NO capturó GPS, solo advertimos pero dejamos enviar
        var seguirSinGps = confirm(
          "⚠️ No usaste la ubicación GPS.\n\n" +
          "Para reportes más confiables recomendamos usar el botón " +
          "«Usar mi ubicación actual (GPS)».\n\n" +
          "¿Querés enviar igual el reporte con la dirección escrita?"
        );
        if (!seguirSinGps) {
          return;
        }
      }

      if (!document.getElementById("conformidad").checked) {
        alert("Marcá la declaración de conformidad antes de enviar el reporte.");
        return;
      }

      var autor = leerIdentidad();
      if (autor === "incompleto") {
        alert("Completá nombre, apellido y DNI, o elegí modo anónimo.");
        return;
      }

      var reportes = JSON.parse(localStorage.getItem("reportes") || "[]");

      var posicion = buscarDuplicado(reportes, categoria, departamento, ubicacion);
      if (posicion !== -1) {
        var existente = reportes[posicion];
        var sumarse = confirm(
          "Ya hay un reporte de \"" + categoria + "\" en \"" + existente.ubicacion + "\", con " +
          (existente.contador || 1) + " vecino(s).\n\n" +
          "Aceptar = sumarme al existente\nCancelar = crear uno nuevo aparte"
        );
        if (sumarse) {
          duplicadoActual = posicion;
          sumarmeAlExistente();
          return;
        }
      }

      var nuevoId = "r" + Date.now() + "-" + Math.floor(Math.random() * 10000);

      reportes.push({
        id: nuevoId,
        categoria: categoria,
        departamento: departamento,
        ubicacion: ubicacion,
        descripcion: descripcion,
        fotos: fotosActuales,
        autor: autor,
        gps: gpsActual,
        fecha: new Date().toLocaleString("es-AR"),
        contador: 1,
        aportes: [],
        denuncias: 0,
        ocultoPorDenuncias: false
      });

      // El que crea el reporte ya cuenta como afectado (con id local temporal)
      marcarComoVotado(nuevoId);

      if (guardar(reportes)) {
        // ETAPA 1: además de guardar local, enviamos a Supabase.
        // Esperamos el id real de Supabase para marcarlo también como votado,
        // así el mismo dispositivo no puede sumar +1 a su propio reporte.
        var idSupabase = await enviarASupabase(reportes[reportes.length - 1]);
        if (idSupabase) {
          marcarComoVotado(idSupabase);
        }
        mostrarHistorial();
        limpiarFormulario();
      }
    }

    /* ---------- +1 con bloqueo por dispositivo ---------- */
    // ETAPA 4: extraer el ID numérico de Supabase desde "sb-123"
    function idNumericoSupabase(idCompuesto) {
      if (typeof idCompuesto !== "string") return null;
      if (idCompuesto.indexOf("sb-") !== 0) return null;
      return parseInt(idCompuesto.substring(3), 10);
    }

    async function sumarUno(posicion) {
      var r = reportesEnMemoria[posicion];
      if (!r) {
        return;
      }

      if (yaVoto(r.id)) {
        alert("Ya sumaste tu voto a este reporte desde este dispositivo.");
        return;
      }

      var idSb = idNumericoSupabase(r.id);
      if (!idSb || !supabaseClient) {
        alert("No se pudo conectar con la nube. Intentá de nuevo en un momento.");
        return;
      }

      var nuevoContador = (r.contador || 1) + 1;
      var { error } = await supabaseClient
        .from("reportes")
        .update({ contador: nuevoContador })
        .eq("id", idSb);

      if (error) {
        console.log("Error al sumar voto:", error);
        alert("No se pudo registrar tu voto. Intentá de nuevo.");
        return;
      }

      marcarComoVotado(r.id);
      console.log("Voto sumado en Supabase. Nuevo contador:", nuevoContador);
      mostrarHistorial();
    }

    /* ---------- Denunciar contenido inapropiado ---------- */
    // Guarda qué reportes ya denunció este dispositivo, para no permitir
    // que la misma persona haga 3 denuncias y oculte cualquier reporte sola
    function reportesDenunciadosDelDispositivo() {
      return JSON.parse(localStorage.getItem("denunciados") || "[]");
    }

    function yaDenuncio(id) {
      return reportesDenunciadosDelDispositivo().indexOf(id) !== -1;
    }

    async function denunciar(posicion) {
      var r = reportesEnMemoria[posicion];
      if (!r) {
        return;
      }

      if (yaDenuncio(r.id)) {
        alert("Ya denunciaste este reporte.");
        return;
      }

      var idSb = idNumericoSupabase(r.id);
      if (!idSb || !supabaseClient) {
        alert("No se pudo conectar con la nube. Intentá de nuevo en un momento.");
        return;
      }

      var motivo = prompt(
        "¿Por qué denunciás este reporte?\n\n" +
        "(Ej: foto ofensiva, contenido falso, ataque personal, etc.)"
      );
      if (motivo === null || motivo.trim() === "") {
        return;
      }

      var nuevasDenuncias = (r.denuncias || 0) + 1;
      var motivosActuales = r.motivosDenuncia || [];
      motivosActuales.push({
        motivo: motivo.trim(),
        fecha: new Date().toLocaleString("es-AR")
      });

      var quedaOculto = nuevasDenuncias >= DENUNCIAS_PARA_OCULTAR;

      var { error } = await supabaseClient
        .from("reportes")
        .update({
          denuncias: nuevasDenuncias,
          motivos_denuncia: motivosActuales,
          oculto: quedaOculto
        })
        .eq("id", idSb);

      if (error) {
        console.log("Error al denunciar:", error);
        alert("No se pudo registrar tu denuncia. Intentá de nuevo.");
        return;
      }

      var denunciados = reportesDenunciadosDelDispositivo();
      denunciados.push(r.id);
      localStorage.setItem("denunciados", JSON.stringify(denunciados));

      console.log("Denuncia registrada. Total denuncias:", nuevasDenuncias);
      alert("Gracias. Tu denuncia fue registrada. Con " + DENUNCIAS_PARA_OCULTAR +
            " denuncias, el reporte se oculta hasta que un administrador lo revise.");
      mostrarHistorial();
    }

    /* ---------- Historial ---------- */
    function claseYTextoContador(contador) {
      if (contador >= UMBRAL_ROJO) {
        return { clase: "contador contador-rojo", texto: " — ALERTA ROJA" };
      }
      if (contador >= UMBRAL_AMARILLO) {
        return { clase: "contador contador-amarillo", texto: " — ALERTA AMARILLA" };
      }
      return { clase: "contador", texto: "" };
    }

    async function mostrarHistorial() {
      // ETAPA 2: leemos de Supabase en vez de localStorage
      var reportes = await traerReportesDeSupabase();
      reportesEnMemoria = reportes; // guardamos para uso de otras funciones
      var historial = document.getElementById("historial");
      var filtro = document.getElementById("filtroHistorial").value;

      if (document.getElementById("estadisticas")) {
        mostrarEstadisticas();
      }

      if (reportes.length === 0) {
        historial.innerHTML = "<p>Todavía no hay reportes.</p>";
        return;
      }

      var html = "";
      var mostrados = 0;

      for (var i = reportes.length - 1; i >= 0; i--) {
        var r = reportes[i];

        // Filtro por departamento
        if (filtro !== "__todos__" && r.departamento !== filtro) {
          continue;
        }

        // Reportes ocultos por denuncias: solo los ve el admin
        if (r.ocultoPorDenuncias && !esAdmin) {
          continue;
        }

        mostrados = mostrados + 1;

        var contador = r.contador || 1;
        var cc = claseYTextoContador(contador);

        var claseReporte = "reporte";
        if (r.ocultoPorDenuncias && esAdmin) {
          claseReporte = "reporte oculto-por-denuncias";
        }

        html = html + "<div class='" + claseReporte + "'>";

        html = html + "<span class='" + cc.clase + "'>" +
          contador + " vecino" + (contador === 1 ? "" : "s") + " afectado" + (contador === 1 ? "" : "s") +
          cc.texto + "</span><br>";

        html = html + "<strong>" + r.categoria + "</strong> en " + r.departamento;
        if (r.ubicacion) {
          html = html + " — " + r.ubicacion;
        }
        html = html + "<br>" + r.descripcion;

        html = html + htmlFotos(r);

        html = html + "<br><a class='enlace-mapa' href='" + enlaceMapa(r) + "' target='_blank'>🗺️ Ver en Google Maps</a>";

        if (r.aportes && r.aportes.length > 0) {
          for (var j = 0; j < r.aportes.length; j++) {
            var a = r.aportes[j];
            html = html + "<div class='aporte'>" + (a.descripcion || "");
            html = html + htmlFotos(a);
            html = html + "<br><small>" + textoAutor(a.autor) + " · " + a.fecha + "</small></div>";
          }
        }

        // Canal municipal según nivel de alerta
        var canal = CANALES[r.departamento] || "Consultá los canales oficiales de tu municipalidad";
        if (contador >= UMBRAL_ROJO) {
          html = html + "<div class='canal-municipio'><strong>ALERTA ROJA — " + contador +
            " vecinos afectados.</strong> Elevá el reclamo por el canal oficial del municipio:<br>" + canal + "</div>";
        } else if (contador >= UMBRAL_AMARILLO) {
          html = html + "<div class='canal-municipio canal-municipio-amarillo'><strong>ALERTA AMARILLA — " + contador +
            " vecinos afectados.</strong> Canal oficial del municipio:<br>" + canal + "</div>";
        }

        html = html + "<br><small>" + textoAutor(r.autor) + " · " + r.fecha + "</small>";

        // Botón +1: bloqueado si ya votó este dispositivo
        if (r.id && yaVoto(r.id)) {
          html = html + "<button class='boton-sumar boton-sumar-hecho' disabled>✓ Ya sumaste tu voto</button>";
        } else {
          html = html + "<button class='boton-sumar' onclick='sumarUno(" + i + ")'>+1 Me afecta también</button>";
        }

        // Botón denunciar contenido inapropiado
        if (r.id && yaDenuncio(r.id)) {
          html = html + "<button class='boton-denunciar' disabled>✓ Ya denunciaste este reporte</button>";
        } else {
          html = html + "<button class='boton-denunciar' onclick='denunciar(" + i + ")'>⚠ Denunciar contenido inapropiado</button>";
        }

        // Panel de admin sobre el reporte
        if (esAdmin) {
          if (r.ocultoPorDenuncias) {
            html = html + "<button class='boton-sumar' onclick='reactivar(" + i + ")'>Reactivar (revisado, contenido OK)</button>";
          }
          html = html + "<button class='boton-borrar-uno' onclick='borrarUno(" + i + ")'>Borrar este reporte (admin)</button>";
          if (r.motivosDenuncia && r.motivosDenuncia.length > 0) {
            html = html + "<div class='canal-municipio'><strong>Motivos de denuncia (" + r.denuncias + "):</strong><br>";
            for (var k = 0; k < r.motivosDenuncia.length; k++) {
              html = html + "• " + r.motivosDenuncia[k].motivo + "<br>";
            }
            html = html + "</div>";
          }
        }

        html = html + "</div>";
      }

      if (mostrados === 0) {
        historial.innerHTML = "<p>No hay reportes que coincidan con el filtro.</p>";
      } else {
        historial.innerHTML = html;
      }
    }
  </script>
</body>
