<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión — Fallas Mendoza</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .login-container, .selector-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 40px;
            width: 100%;
            max-width: 480px;
            margin: 60px auto;
        }

        .panel-header {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .panel-header-info h1 {
            color: #2c3e50;
            font-size: 20px;
            margin-bottom: 4px;
        }

        .panel-header-info .user-info {
            color: #7f8c8d;
            font-size: 13px;
        }

        .panel-header-actions { display: flex; gap: 10px; }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 6px;
            color: #34495e;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="email"], input[type="password"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.2s;
            background: white;
        }

        input:focus, select:focus { outline: none; border-color: #3498db; }

        button {
            padding: 10px 18px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.full-width { width: 100%; padding: 12px; font-size: 15px; }
        button:hover { background: #2980b9; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        button.secondary { background: #95a5a6; }
        button.secondary:hover { background: #7f8c8d; }

        .error {
            background: #fee;
            color: #c0392b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 14px;
            display: none;
        }

        .badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .badge-superadmin { background: #8e44ad; color: white; }
        .badge-admin { background: #e74c3c; color: white; }
        .badge-operador { background: #27ae60; color: white; }

        .estado-nuevo { background: #3498db; color: white; }
        .estado-asignado { background: #f39c12; color: white; }
        .estado-en_proceso { background: #9b59b6; color: white; }
        .estado-resuelto { background: #27ae60; color: white; }
        .estado-rechazado { background: #95a5a6; color: white; }

        .municipio-tag {
            background: #ecf0f1;
            color: #34495e;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            margin-right: 6px;
        }

        .municipio-activo {
            background: #e8f4fc;
            color: #2980b9;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #3498db;
        }

        .footer-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            font-size: 13px;
            text-decoration: none;
        }

        .footer-link:hover { color: #3498db; }

        .reclamos-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 25px;
            overflow-x: auto;
        }

        .reclamos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .reclamos-title {
            color: #2c3e50;
            font-size: 18px;
            font-weight: 600;
        }

        .reclamos-count {
            color: #7f8c8d;
            font-size: 14px;
            margin-left: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: #ecf0f1;
            color: #34495e;
            text-align: left;
            padding: 12px 10px;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 2px solid #d5dbdb;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #ecf0f1;
            color: #2c3e50;
        }

        tr.reclamo-row { cursor: pointer; transition: background 0.15s; }
        tr.reclamo-row:hover { background: #f8f9fa; }

        tr.detalle-row { background: #fafbfc; }
        tr.detalle-row td { padding: 20px; }

        .detalle-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .detalle-foto img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 8px;
        }

        .detalle-info {
            font-size: 14px;
            line-height: 1.6;
        }

        .detalle-info p { margin-bottom: 6px; }

        .detalle-info strong {
            color: #34495e;
            display: inline-block;
            min-width: 110px;
        }

        .detalle-descripcion {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #3498db;
            margin-top: 10px;
            white-space: pre-wrap;
        }

        .lista-aportes {
            background: white;
            padding: 10px 12px;
            border-radius: 6px;
            border-left: 3px solid #27ae60;
            margin-top: 8px;
            font-size: 13px;
        }

        .lista-aportes .aporte-item {
            padding: 6px 0;
            border-bottom: 1px dashed #ecf0f1;
        }

        .lista-aportes .aporte-item:last-child { border-bottom: none; }

        .aporte-autor {
            font-weight: 600;
            color: #27ae60;
            font-size: 12px;
        }

        .map-link {
            display: inline-block;
            margin-top: 6px;
            font-size: 12px;
            color: #3498db;
            text-decoration: none;
        }

        .map-link:hover { text-decoration: underline; }

        .loading, .empty {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .btn-ver { padding: 6px 12px; font-size: 12px; }

        .cambiar-municipio-btn {
            background: transparent;
            color: #3498db;
            padding: 4px 10px;
            font-size: 12px;
            text-decoration: underline;
            border: none;
        }

        .cambiar-municipio-btn:hover { background: transparent; color: #2980b9; }

        @media (max-width: 768px) {
            .detalle-grid { grid-template-columns: 1fr; }
            th, td { padding: 8px 6px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN -->
        <div id="login-screen" class="login-container">
            <h1>🏛️ Panel de Gestión</h1>
            <p class="subtitle">Acceso para funcionarios municipales</p>
            <div class="error" id="error-msg"></div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="usuario@municipio.gob.ar" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button id="login-btn" class="full-width" onclick="login()">Ingresar</button>
            <a href="index.html" class="footer-link">← Volver a la app pública</a>
        </div>

        <!-- SELECTOR DE MUNICIPIO (superadmin) -->
        <div id="selector-screen" class="selector-container" style="display:none;">
            <h1>🏛️ Panel Superadmin</h1>
            <p class="subtitle">¿Qué municipio querés gestionar hoy?</p>
            <div class="form-group">
                <label for="municipio-select">Municipio</label>
                <select id="municipio-select">
                    <option value="">Cargando...</option>
                </select>
            </div>
            <button class="full-width" onclick="confirmarMunicipio()">Entrar al panel</button>
            <button class="full-width secondary" style="margin-top:10px;" onclick="logout()">Cerrar sesión</button>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard-screen" style="display:none;">
            <div class="panel-header">
                <div class="panel-header-info">
                    <h1>🏛️ Panel de Gestión</h1>
                    <div class="user-info">
                        <span id="user-nombre">-</span> ·
                        <span id="user-rol-badge">-</span> ·
                        <span class="municipio-activo" id="municipio-activo">-</span>
                        <button class="cambiar-municipio-btn" id="btn-cambiar-municipio" style="display:none;" onclick="volverASelector()">cambiar municipio</button>
                    </div>
                </div>
                <div class="panel-header-actions">
                    <button class="secondary" onclick="logout()">Cerrar sesión</button>
                </div>
            </div>

            <div class="reclamos-container">
                <div class="reclamos-header">
                    <div>
                        <span class="reclamos-title">Reclamos</span>
                        <span class="reclamos-count" id="reclamos-count"></span>
                    </div>
                    <button onclick="cargarReclamos()">🔄 Actualizar</button>
                </div>
                <div id="reclamos-content">
                    <div class="loading">Cargando reclamos...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var SUPABASE_URL = "https://yvotjekqbddmtfdhfshp.supabase.co";
        var SUPABASE_KEY = "sb_publishable_gE5qnHyML6fN3NL_A7ceKQ_f3GyxL5f";

        var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        var usuarioActual = null;
        var municipioSeleccionado = null;
        var filasExpandidas = {};

        window.addEventListener('load', async function() {
            var { data: { session } } = await supabase.auth.getSession();
            if (session) {
                procesarLogin(session.user);
            }
        });

        async function login() {
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var loginBtn = document.getElementById('login-btn');

            document.getElementById('error-msg').style.display = 'none';

            if (!email || !password) {
                mostrarError('Ingresá email y contraseña.');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Ingresando...';

            var { data, error } = await supabase.auth.signInWithPassword({
                email: email, password: password
            });

            loginBtn.disabled = false;
            loginBtn.textContent = 'Ingresar';

            if (error) {
                mostrarError('Email o contraseña incorrectos.');
                return;
            }

            procesarLogin(data.user);
        }

        async function procesarLogin(user) {
            var { data: perfil, error } = await supabase
                .from('usuarios_gestion')
                .select('nombre, rol, area_id, municipio_id, areas(nombre), municipios(nombre)')
                .eq('id', user.id)
                .single();

            if (error || !perfil) {
                mostrarError('Este usuario no está registrado como gestor. Contactá al administrador.');
                await supabase.auth.signOut();
                return;
            }

            usuarioActual = {
                id: user.id,
                email: user.email,
                nombre: perfil.nombre,
                rol: perfil.rol,
                area_id: perfil.area_id,
                area_nombre: perfil.areas ? perfil.areas.nombre : null,
                municipio_id: perfil.municipio_id,
                municipio_nombre: perfil.municipios ? perfil.municipios.nombre : null
            };

            if (usuarioActual.rol === 'superadmin') {
                await mostrarSelectorMunicipio();
            } else {
                municipioSeleccionado = {
                    id: usuarioActual.municipio_id,
                    nombre: usuarioActual.municipio_nombre
                };
                mostrarDashboard();
            }
        }

        async function mostrarSelectorMunicipio() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('selector-screen').style.display = 'block';

            var { data: municipios, error } = await supabase
                .from('municipios')
                .select('id, nombre')
                .eq('activo', true)
                .order('nombre');

            var select = document.getElementById('municipio-select');
            if (error || !municipios) {
                select.innerHTML = '<option value="">Error al cargar municipios</option>';
                return;
            }

            var html = '<option value="TODOS">— Ver todos los municipios —</option>';
            municipios.forEach(function(m) {
                html += '<option value="' + m.id + '">' + escaparHTML(m.nombre) + '</option>';
            });
            select.innerHTML = html;
        }

        function confirmarMunicipio() {
            var select = document.getElementById('municipio-select');
            var valor = select.value;
            var texto = select.options[select.selectedIndex].text;

            if (!valor) return;

            if (valor === 'TODOS') {
                municipioSeleccionado = { id: null, nombre: 'Todos los municipios' };
            } else {
                municipioSeleccionado = { id: parseInt(valor), nombre: texto };
            }

            mostrarDashboard();
        }

        function volverASelector() {
            document.getElementById('dashboard-screen').style.display = 'none';
            mostrarSelectorMunicipio();
        }

        function mostrarDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('selector-screen').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'block';

            document.getElementById('user-nombre').textContent = usuarioActual.nombre;

            var rolBadge = document.getElementById('user-rol-badge');
            if (usuarioActual.rol === 'superadmin') {
                rolBadge.innerHTML = '<span class="badge badge-superadmin">SUPERADMIN</span>';
                document.getElementById('btn-cambiar-municipio').style.display = 'inline-block';
            } else if (usuarioActual.rol === 'admin') {
                rolBadge.innerHTML = '<span class="badge badge-admin">ADMIN</span>';
                document.getElementById('btn-cambiar-municipio').style.display = 'none';
            } else {
                rolBadge.innerHTML = '<span class="badge badge-operador">OPERADOR</span> · <span style="font-size:12px;color:#7f8c8d;">' + escaparHTML(usuarioActual.area_nombre || 'Sin área') + '</span>';
                document.getElementById('btn-cambiar-municipio').style.display = 'none';
            }

            document.getElementById('municipio-activo').textContent = '📍 ' + municipioSeleccionado.nombre;

            cargarReclamos();
        }

        async function cargarReclamos() {
            var contenedor = document.getElementById('reclamos-content');
            contenedor.innerHTML = '<div class="loading">Cargando reclamos...</div>';
            filasExpandidas = {};

            var query = supabase
                .from('reportes')
                .select('*, areas(nombre), municipios(nombre)')
                .eq('oculto', false)
                .order('id', { ascending: false });

            if (municipioSeleccionado.id !== null) {
                query = query.eq('municipio_id', municipioSeleccionado.id);
            }

            var { data: reclamos, error } = await query;

            if (error) {
                contenedor.innerHTML = '<div class="empty">Error al cargar los reclamos: ' + error.message + '</div>';
                return;
            }

            document.getElementById('reclamos-count').textContent = '(' + reclamos.length + ')';

            if (reclamos.length === 0) {
                contenedor.innerHTML = '<div class="empty">No hay reclamos en este municipio todavía.</div>';
                return;
            }

            renderTabla(reclamos);
        }

        function renderTabla(reclamos) {
            var esSuperadminViendoTodos = (usuarioActual.rol === 'superadmin' && municipioSeleccionado.id === null);

            var html = '<table><thead><tr>';
            html += '<th>ID</th>';
            html += '<th>Fecha</th>';
            if (esSuperadminViendoTodos) {
                html += '<th>Municipio</th>';
            }
            html += '<th>Categoría</th>';
            html += '<th>Estado</th>';
            html += '<th>Área</th>';
            html += '<th>Votos</th>';
            html += '<th>Aportes</th>';
            html += '<th>Acción</th>';
            html += '</tr></thead><tbody>';

            reclamos.forEach(function(r) {
                var fecha = formatearFecha(r.created_at);
                var estado = r.estado || 'nuevo';
                var area = (r.areas && r.areas.nombre) ? r.areas.nombre : '—';
                var municipio = (r.municipios && r.municipios.nombre) ? r.municipios.nombre : '—';
                var votos = r.contador || 0;
                var cantAportes = contarAportes(r.aportes);

                html += '<tr class="reclamo-row" onclick="toggleDetalle(' + r.id + ')">';
                html += '<td>#' + r.id + '</td>';
                html += '<td>' + fecha + '</td>';
                if (esSuperadminViendoTodos) {
                    html += '<td><span class="municipio-tag">' + escaparHTML(municipio) + '</span></td>';
                }
                html += '<td>' + escaparHTML(r.categoria || '—') + '</td>';
                html += '<td><span class="badge estado-' + estado + '">' + estado.replace('_', ' ') + '</span></td>';
                html += '<td>' + escaparHTML(area) + '</td>';
                html += '<td>' + votos + '</td>';
                html += '<td>' + cantAportes + '</td>';
                html += '<td><button class="btn-ver" onclick="event.stopPropagation(); toggleDetalle(' + r.id + ')">Ver detalle</button></td>';
                html += '</tr>';

                var colspan = esSuperadminViendoTodos ? 9 : 8;
                html += '<tr class="detalle-row" id="detalle-' + r.id + '" style="display:none;"><td colspan="' + colspan + '">';
                html += renderDetalle(r);
                html += '</td></tr>';
            });

            html += '</tbody></table>';
            document.getElementById('reclamos-content').innerHTML = html;
        }

        function renderDetalle(r) {
            var html = '<div class="detalle-grid">';

            // Columna izquierda: foto(s)
            html += '<div class="detalle-foto">';
            var fotos = r.fotos;
            if (fotos && Array.isArray(fotos) && fotos.length > 0) {
                fotos.forEach(function(f) {
                    var url = (typeof f === 'string') ? f : (f.url || '');
                    if (url) {
                        html += '<img src="' + escaparHTML(url) + '" alt="Foto del reclamo">';
                    }
                });
            } else {
                html += '<div style="padding:40px; background:#ecf0f1; border-radius:8px; text-align:center; color:#95a5a6;">Sin foto</div>';
            }
            html += '</div>';

            // Columna derecha: datos
            html += '<div class="detalle-info">';

            // Ubicación (en vez de dirección)
            html += '<p><strong>Ubicación:</strong> ' + escaparHTML(r.ubicacion || '—') + '</p>';
            html += '<p><strong>Departamento:</strong> ' + escaparHTML(r.departamento || '—') + '</p>';

            // GPS (lee el JSON)
            var gpsTexto = formatearGPS(r.gps);
            html += '<p><strong>Coordenadas:</strong> ' + gpsTexto + '</p>';

            // Autor (JSON): nombre + DNI, o Anónimo
            var autorTexto = formatearAutor(r.autor);
            html += '<p><strong>Vecino:</strong> ' + autorTexto + '</p>';

            // Votos y denuncias
            html += '<p><strong>Votos (+1):</strong> ' + (r.contador || 0) + '</p>';
            html += '<p><strong>Denuncias:</strong> ' + (r.denuncias || 0) + '</p>';

            // Descripción
            html += '<p style="margin-top:10px;"><strong>Descripción:</strong></p>';
            html += '<div class="detalle-descripcion">' + escaparHTML(r.descripcion || '(sin descripción)') + '</div>';

            // Aportes (lista completa — decisión B del usuario)
            var aportes = r.aportes;
            if (aportes && Array.isArray(aportes) && aportes.length > 0) {
                html += '<p style="margin-top:10px;"><strong>Aportes (' + aportes.length + '):</strong></p>';
                html += '<div class="lista-aportes">';
                aportes.forEach(function(ap) {
                    html += '<div class="aporte-item">';
                    var autorAporte = formatearAutor(ap.autor) || 'Anónimo';
                    html += '<div class="aporte-autor">' + autorAporte + '</div>';
                    html += '<div>' + escaparHTML(ap.texto || ap.descripcion || ap.aporte || JSON.stringify(ap)) + '</div>';
                    html += '</div>';
                });
                html += '</div>';
            }

            // Observaciones internas
            if (r.observaciones_internas) {
                html += '<p style="margin-top:10px;"><strong>Obs. internas:</strong></p>';
                html += '<div class="detalle-descripcion" style="border-left-color:#e67e22;">' + escaparHTML(r.observaciones_internas) + '</div>';
            }

            html += '</div>';
            html += '</div>';
            return html;
        }

        // --- Helpers de formateo ---

        function formatearGPS(gps) {
            if (!gps) return '—';
            try {
                // Puede venir como objeto o como string JSON
                var obj = (typeof gps === 'string') ? JSON.parse(gps) : gps;
                var lat = obj.lat || obj.latitud || obj.latitude;
                var lng = obj.lng || obj.lon || obj.longitud || obj.longitude;
                if (lat && lng) {
                    var latStr = Number(lat).toFixed(5);
                    var lngStr = Number(lng).toFixed(5);
                    var mapUrl = 'https://www.google.com/maps?q=' + lat + ',' + lng;
                    return latStr + ', ' + lngStr + ' <a href="' + mapUrl + '" target="_blank" class="map-link">📍 ver en mapa</a>';
                }
                return '—';
            } catch (e) {
                return '—';
            }
        }

        function formatearAutor(autor) {
            if (!autor) return 'Anónimo';
            try {
                var obj = (typeof autor === 'string') ? JSON.parse(autor) : autor;
                var nombre = obj.nombre || obj.nombre_apellido || '';
                var dni = obj.dni || obj.documento || '';
                var contacto = obj.contacto || obj.telefono || obj.email || '';

                if (!nombre && !dni) return 'Anónimo';

                var partes = [];
                if (nombre) partes.push(escaparHTML(nombre));
                if (dni) partes.push('DNI ' + escaparHTML(dni));
                if (contacto) partes.push(escaparHTML(contacto));
                return partes.join(' · ');
            } catch (e) {
                return 'Anónimo';
            }
        }

        function contarAportes(aportes) {
            if (!aportes) return 0;
            try {
                var arr = (typeof aportes === 'string') ? JSON.parse(aportes) : aportes;
                if (Array.isArray(arr)) return arr.length;
                return 0;
            } catch (e) {
                return 0;
            }
        }

        function toggleDetalle(id) {
            var fila = document.getElementById('detalle-' + id);
            if (!fila) return;
            if (fila.style.display === 'none') {
                fila.style.display = 'table-row';
                filasExpandidas[id] = true;
            } else {
                fila.style.display = 'none';
                delete filasExpandidas[id];
            }
        }

        function formatearFecha(fechaStr) {
            if (!fechaStr) return '—';
            try {
                var d = new Date(fechaStr);
                var dia = String(d.getDate()).padStart(2, '0');
                var mes = String(d.getMonth() + 1).padStart(2, '0');
                var anio = d.getFullYear();
                return dia + '/' + mes + '/' + anio;
            } catch (e) { return fechaStr; }
        }

        function escaparHTML(texto) {
            if (texto === null || texto === undefined) return '';
            var div = document.createElement('div');
            div.textContent = String(texto);
            return div.innerHTML;
        }

        async function logout() {
            await supabase.auth.signOut();
            usuarioActual = null;
            municipioSeleccionado = null;
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('selector-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        function mostrarError(msg) {
            var errorMsg = document.getElementById('error-msg');
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
        document.getElementById('email').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });
    </script>
</body>
</html>
