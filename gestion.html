<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fallas Mendoza — Panel de Gestión</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  background-color: #EDEDE8;
  margin: 0;
  min-height: 100vh;
}
header {
  background-color: #1C1D21;
  color: white;
  padding: 20px;
  text-align: center;
}
h1 {
  color: #FFC400;
  margin: 0;
  font-size: 32px;
}
header p {
  color: #E8E8E3;
  margin: 8px 0 0;
  font-size: 14px;
}
main {
  max-width: 450px;
  margin: 40px auto;
  background-color: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
h2 {
  color: #1C1D21;
  margin-top: 0;
  font-size: 22px;
}
label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 5px;
  color: #1C1D21;
}
input {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  border: 1.5px solid #D8D8D2;
  border-radius: 8px;
}
input:focus {
  outline: none;
  border-color: #FFC400;
}
button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  background-color: #FFC400;
  color: #1C1D21;
  font-size: 16px;
  font-weight: bold;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
button:hover { background-color: #E6B000; }
button:disabled { background-color: #D8D8D2; cursor: not-allowed; }
.boton-logout {
  background-color: white;
  color: #C0362C;
  border: 1.5px solid #C0362C;
  margin-top: 25px;
}
.boton-logout:hover { background-color: #FFF5F4; }
.error {
  background-color: #FFEBEA;
  color: #C0362C;
  padding: 12px;
  border-radius: 8px;
  margin-top: 15px;
  font-size: 14px;
  display: none;
}
.info-card {
  background-color: #F5F5F0;
  padding: 15px;
  border-radius: 8px;
  margin-top: 15px;
}
.info-card p { margin: 6px 0; font-size: 15px; }
.info-card strong { color: #1C1D21; }
.rol-badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: bold;
  color: white;
}
.rol-admin { background-color: #1C1D21; }
.rol-operador { background-color: #2C5F8D; }
.loading { text-align: center; color: #666; padding: 20px; }
.footer-link { text-align: center; margin-top: 20px; font-size: 13px; }
.footer-link a { color: #2C5F8D; text-decoration: none; }
</style>
</head>
<body>

<header>
  <h1>Fallas Mendoza</h1>
  <p>Panel de Gestión Municipal</p>
</header>

<main>

  <section id="loading-section">
    <div class="loading">Verificando sesión...</div>
  </section>

  <section id="login-section" style="display:none">
    <h2>Ingresar al panel</h2>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" id="login-btn">Iniciar sesión</button>
    </form>
    <div class="error" id="login-error"></div>
    <div class="footer-link">
      <a href="https://manologuevara2013-png.github.io/fallasmendoza/">Volver a la app pública</
    </div>
  </section>

  <section id="welcome-section" style="display:none">
    <h2>Bienvenido/a</h2>
    <div class="info-card" id="user-info"></div>
    <button class="boton-logout" id="logout-btn">Cerrar sesión</button>
    <div class="footer-link">
      <a href=<a href="https://manologuevara2013-png.github.io/fallasmendoza/">Ir a la app pública</a>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================
// CONFIGURACIÓN — pegá los mismos valores que ya tenés en index.html
// ============================================================
const SUPABASE_URL = "https://yvotjekqbddmtfdhfshp.supabase.co";
const SUPABASE_KEY = "sb_publishable_gE5qnHyML6fN3NL_A7ceKQ_f3GyxL5f";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// Referencias
const loadingSection = document.getElementById('loading-section');
const loginSection = document.getElementById('login-section');
const welcomeSection = document.getElementById('welcome-section');
const loginForm = document.getElementById('login-form');
const loginBtn = document.getElementById('login-btn');
const loginError = document.getElementById('login-error');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const userInfo = document.getElementById('user-info');
const logoutBtn = document.getElementById('logout-btn');

// Al cargar: verificar si ya hay sesión activa
async function verificarSesion() {
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    await mostrarBienvenida(session.user);
  } else {
    mostrarLogin();
  }
}

function mostrarLogin() {
  loadingSection.style.display = 'none';
  welcomeSection.style.display = 'none';
  loginSection.style.display = 'block';
  passwordInput.value = '';
}

async function mostrarBienvenida(user) {
  loadingSection.style.display = 'block';
  loginSection.style.display = 'none';
  welcomeSection.style.display = 'none';

  // Leer el perfil del usuario desde usuarios_gestion
  const { data: perfil, error } = await db
    .from('usuarios_gestion')
    .select('nombre, rol, activo, area_id, areas(nombre)')
    .eq('id', user.id)
    .single();

  if (error) {
    console.error('Error leyendo usuarios_gestion:', error);
    await db.auth.signOut();
    mostrarLogin();
    loginError.textContent = 'No pudimos leer tu perfil. Revisá la consola (F12) y contactá al administrador.';
    loginError.style.display = 'block';
    return;
  }

  if (!perfil) {
    await db.auth.signOut();
    mostrarLogin();
    loginError.textContent = 'Tu usuario no tiene permisos de gestión. Contactá al administrador.';
    loginError.style.display = 'block';
    return;
  }

  if (!perfil.activo) {
    await db.auth.signOut();
    mostrarLogin();
    loginError.textContent = 'Tu usuario está desactivado. Contactá al administrador.';
    loginError.style.display = 'block';
    return;
  }

  const rolLabel = perfil.rol === 'admin' ? 'Administrador' : 'Operador';
  const rolClass = perfil.rol === 'admin' ? 'rol-admin' : 'rol-operador';
  const areaTexto = perfil.areas ? perfil.areas.nombre : 'Todas las áreas';

  userInfo.innerHTML =
    '<p><strong>Nombre:</strong> ' + perfil.nombre + '</p>' +
    '<p><strong>Email:</strong> ' + user.email + '</p>' +
    '<p><strong>Rol:</strong> <span class="rol-badge ' + rolClass + '">' + rolLabel + '</span></p>' +
    '<p><strong>Área:</strong> ' + areaTexto + '</p>';

  loadingSection.style.display = 'none';
  welcomeSection.style.display = 'block';
}

// Login
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginBtn.disabled = true;
  loginBtn.textContent = 'Ingresando...';
  loginError.style.display = 'none';

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  const { data, error } = await db.auth.signInWithPassword({ email, password });

  loginBtn.disabled = false;
  loginBtn.textContent = 'Iniciar sesión';

  if (error) {
    console.error('Error de login:', error);
    loginError.textContent = 'Email o contraseña incorrectos.';
    loginError.style.display = 'block';
    return;
  }

  await mostrarBienvenida(data.user);
});

// Logout
logoutBtn.addEventListener('click', async () => {
  await db.auth.signOut();
  mostrarLogin();
});

// Arrancar
verificarSesion();
</script>

</body>
</html>
