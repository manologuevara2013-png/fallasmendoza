<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión — Fallas Mendoza</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 40px;
            width: 100%;
            max-width: 480px;
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #34495e;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #2980b9;
        }

        button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .error {
            background: #fee;
            color: #c0392b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 14px;
            display: none;
        }

        .welcome {
            text-align: center;
        }

        .welcome h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .info-box {
            background: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #d5dbdb;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #7f8c8d;
            font-size: 14px;
        }

        .info-value {
            color: #2c3e50;
            font-weight: 500;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-admin {
            background: #e74c3c;
            color: white;
        }

        .badge-operador {
            background: #27ae60;
            color: white;
        }

        .logout-btn {
            background: #95a5a6;
            margin-top: 10px;
        }

        .logout-btn:hover {
            background: #7f8c8d;
        }

        .footer-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            font-size: 13px;
            text-decoration: none;
        }

        .footer-link:hover {
            color: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Pantalla de LOGIN -->
        <div id="login-screen">
            <h1>🏛️ Panel de Gestión</h1>
            <p class="subtitle">Acceso para funcionarios municipales</p>
            <div class="error" id="error-msg"></div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="usuario@municipio.gob.ar" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button id="login-btn" onclick="login()">Ingresar</button>
            <a href="index.html" class="footer-link">← Volver a la app pública</a>
        </div>

        <!-- Pantalla de BIENVENIDA (post-login) -->
        <div id="welcome-screen" style="display:none;">
            <div class="welcome">
                <h1>🏛️ Panel de Gestión</h1>
                <p class="subtitle">Sesión activa</p>
                <div class="info-box">
                    <div class="info-row">
                        <span class="info-label">Nombre</span>
                        <span class="info-value" id="user-nombre">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Email</span>
                        <span class="info-value" id="user-email">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Rol</span>
                        <span class="info-value" id="user-rol">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Área</span>
                        <span class="info-value" id="user-area">-</span>
                    </div>
                </div>
                <p style="color:#7f8c8d; font-size:13px; margin: 20px 0;">
                    ✓ Login funcionando correctamente.<br>
                    El dashboard con reclamos se agrega en el próximo paso.
                </p>
                <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
                <a href="index.html" class="footer-link">Ir a la app pública</a>
            </div>
        </div>
    </div>

    <script>
        var SUPABASE_URL = "https://yvotjekqbddmtfdhfshp.supabase.co";
        var SUPABASE_KEY = "sb_publishable_gE5qnHyML6fN3NL_A7ceKQ_f3GyxL5f";

        var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Al cargar la página, verificar si ya hay sesión activa
        window.addEventListener('load', async function() {
            var { data: { session } } = await supabase.auth.getSession();
            if (session) {
                mostrarBienvenida(session.user);
            }
        });

        async function login() {
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var errorMsg = document.getElementById('error-msg');
            var loginBtn = document.getElementById('login-btn');

            errorMsg.style.display = 'none';

            if (!email || !password) {
                mostrarError('Ingresá email y contraseña.');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Ingresando...';

            var { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            loginBtn.disabled = false;
            loginBtn.textContent = 'Ingresar';

            if (error) {
                mostrarError('Email o contraseña incorrectos.');
                return;
            }

            mostrarBienvenida(data.user);
        }

        async function mostrarBienvenida(user) {
            // Buscar datos del usuario en usuarios_gestion
            var { data: perfil, error } = await supabase
                .from('usuarios_gestion')
                .select('nombre, rol, area_id, areas(nombre)')
                .eq('id', user.id)
                .single();

            if (error || !perfil) {
                mostrarError('Este usuario no está registrado como gestor. Contactá al administrador.');
                await supabase.auth.signOut();
                return;
            }

            document.getElementById('user-nombre').textContent = perfil.nombre;
            document.getElementById('user-email').textContent = user.email;

            var rolElem = document.getElementById('user-rol');
            if (perfil.rol === 'admin') {
                rolElem.innerHTML = '<span class="badge badge-admin">ADMIN</span>';
                document.getElementById('user-area').textContent = 'Todas las áreas';
            } else {
                rolElem.innerHTML = '<span class="badge badge-operador">OPERADOR</span>';
                document.getElementById('user-area').textContent = perfil.areas ? perfil.areas.nombre : 'Sin asignar';
            }

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('welcome-screen').style.display = 'block';
        }

        async function logout() {
            await supabase.auth.signOut();
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        function mostrarError(msg) {
            var errorMsg = document.getElementById('error-msg');
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        // Permitir login con Enter
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
        document.getElementById('email').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });
    </script>
</body>
</html>
